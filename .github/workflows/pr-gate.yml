name: agent-extensions PR Gate

# The aggregating `agent-extensions PR Gate` job is the only required
# status check on main. It fails unless every job below concluded exactly
# `success` at the exact PR head. Gate logic lives in .github/ci/ and is
# unit-tested in tests/test_ci_gate.py.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read  # live-head check reads the PR via the API
  issues: read  # queue guard reads the PR timeline (owner:queue-exempt provenance)

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy · linked Issue and issue branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require closing keyword and issue/<n>-<slug> branch
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 .github/ci/policy.py
      # Queue v2 guard (#74; std#287): every Issue this PR closes must be on
      # the active item of the owner's execution queue, unless the owner
      # applied owner:queue-exempt. std's guard, fetched from std main.
      - name: Work matches the execution queue
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I agent_extensions/queue_cli.py guard --pr-event "$GITHUB_EVENT_PATH"
      - name: Not a pull request
        if: github.event_name != 'pull_request'
        run: echo "Policy applies to pull requests only (event ${{ github.event_name }})."

  hygiene:
    name: Hygiene · whitespace and compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No whitespace errors in tracked files
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD --
      - name: Python compiles
        run: python3 -m compileall -q agent_extensions tests .github/ci

  pytest:
    name: Tests · pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned dev requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest (pwsh-backed conformance tests included)
        run: |
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          python -m pytest -q

  shell:
    name: Tests · bootstrap *.test.sh
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run every bash test script
        run: python3 .github/ci/script_tests.py sh

  pwsh:
    name: Tests · bootstrap *.test.ps1
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run every hermetic PowerShell test script
        run: python3 .github/ci/script_tests.py ps1

  gate:
    name: agent-extensions PR Gate
    runs-on: ubuntu-latest
    needs: [policy, hygiene, pytest, shell, pwsh]
    if: always()
    steps:
      - name: Check out exact ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every job concluded exactly success
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED_JOBS: policy hygiene pytest shell pwsh
        run: python3 .github/ci/gate.py
      - name: Tested SHA is the live PR head
        if: github.event_name == 'pull_request'
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_API_URL: ${{ github.event.pull_request.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          live="$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "$PR_API_URL" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["head"]["sha"])')"
          echo "event head: ${EVENT_HEAD}"
          echo "live head:  ${live}"
          if [ "$live" != "$EVENT_HEAD" ]; then
            echo "ERROR: the PR head moved during this run; a fresh run gates the new head." >&2
            exit 1
          fi
